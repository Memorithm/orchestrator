agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session_on_this_repository
    - before_scheduler_agent_backend_publication_or_merge_policy_changes
    - before_integrating_SoulSystem_CCOS_Verify_or_ElasticXxx
    - before_PR_or_merge_decisions
  must_update_this_file:
    - when_repository_policy_ingestion_semantics_change
    - when_a_coding_backend_is_added_removed_or_reclassified
    - when_cross_repository_dependency_scheduling_changes
    - when_a_roadmap_phase_changes_status
  fail_closed: >-
    If this roadmap cannot be read, do not make major scheduler, coding-backend,
    publication, cross-repository policy, or merge decisions. Read-only diagnosis
    is allowed.