schema_version: 1
kind: memorithm_orchestrator_ecosystem_agent_roadmap
status: active
last_updated: "2026-09-02"
repository: Memorithm/orchestrator
intended_consumer: autonomous_coding_agent
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests

mission:
  primary: >-
    Evolve Memorithm Orchestrator as the autonomous GitHub development control
    plane for the organization: discover repositories, respect repository policy,
    triage CI/issues/PRs, delegate coding into isolated workspaces, validate,
    publish reviewable PRs, repair failing trusted PRs, and merge only after
    exact-head required CI is definitively green.
  ecosystem_goal: >-
    Make every repository's off-main agent roadmap and default-branch bootstrap a
    first-class scheduling input. Orchestrator owns GitHub development lifecycle;
    SoulSystem may own a canonical coding-agent backend, CCOS may own context
    memory, and SciRust Hub remains the runtime/product control plane rather than
    a duplicate GitHub development orchestrator.

verified_current_facts:
  - autonomous_coding_is_PR_only_and_never_commits_directly_to_default_branches
  - failing_trusted_PR_CI_has_priority_over_new_issue_work
  - pending_no_checks_unknown_and_external_PR_states_are_non_actionable_or_blocking_under_documented_rules
  - optional_auto_merge_revalidates_exact_head_and_base_before_merge_without_admin_bypass_or_force_push
  - OpenCode_currently_runs_under_a_restrictive_inline_policy_and_only_local_Ollama_is_accepted_for_autonomous_runs
  - Orchestrator_itself_owns_commit_push_PR_creation_and_optional_merge_mutations
  - resource_admission_and_managed_workspace_cleanup_are_bounded_and_fail_conservatively
  - current_validation_always_runs_git_diff_check_and_basic_Rust_workspace_checks_when_a_root_Cargo_manifest_exists
  - ORCH0_PR_35_merged_at_main_35ee35f1_with_exact_base_and_exact_head_green_CI
  - actionable_issue_CI_repair_publication_recovery_and_merge_paths_now_bind_to_parent_resolved_repository_policy_snapshots
  - publication_state_v3_binds_resumable_publication_to_policy_identity_and_legacy_unbound_resume_fails_closed
  - policy_ingestion_supports_repository_metadata_derived_nonstandard_default_branches
  - ORCH1a_PR_37_merged_at_main_159eed70_with_exact_base_and_exact_head_green_CI
  - structured_roadmap_items_marked_human_only_or_forbidden_to_initiate_are_deferred_before_agent_execution
  - policy_denial_is_a_non_failure_scheduler_deferral_and_the_exact_reason_is_recorded_in_trajectory_detail
  - contextual_mentions_of_forbidden_items_do_not_override_an_explicitly_allowed_current_target
  - free_form_scientific_financial_or_custody_prose_is_not_interpreted_as_machine_authorization
  - ORCH1b_PR_40_merged_at_main_140f627861b415784f4676584c594d38383fc2a6_with_exact_head_green_CI
  - repository_global_autonomous_action_policy_is_versioned_explicit_and_machine_readable
  - global_action_policy_supports_financial_execution_custody_mutation_credential_mutation_and_external_side_effect_categories
  - global_action_denies_require_an_explicit_task_action_category_and_never_infer_from_free_text
  - task_scoped_ORCH1a_denies_take_precedence_over_repository_global_allows
  - read_only_scan_status_and_diagnosis_remain_available_when_a_mutating_action_category_is_denied

invariants:
  - no_autonomous_direct_default_branch_coding
  - no_merge_with_failed_pending_missing_unknown_or_stale_required_CI
  - merge_decisions_are_bound_to_exact_PR_head_and_validated_base_tip
  - no_force_push_or_admin_bypass_for_autonomous_work
  - external_or_untrusted_PRs_are_not_repaired_or_merged_automatically
  - agent_backend_cannot_commit_push_rewrite_history_or_mutate_GitHub_state_directly
  - repository_specific_bootstrap_policy_must_dominate_generic_scheduler_defaults
  - scientific_human_only_or_financial_fail_closed_rules_must_never_be_bypassed_by_generic_automation
  - stale_issue_PR_repository_or_publication_transactions_fail_closed
  - required_CI_must_be_green_on_exact_PR_head_before_merge

ownership:
  role: organization_GitHub_development_control_plane
  owns:
    - repository_scan_triage_and_development_eligibility
    - issue_and_PR_scheduler_priority
    - isolated_managed_clones_and_publication_transactions
    - Git_commit_push_PR_creation_and_optional_merge_mutations
    - exact_head_CI_and_base_sync_merge_gates
    - agent_backend_policy_boundary_for_development_tasks
  does_not_own:
    - SoulSystem_inner_coding_agent_reasoning_tool_or_session_semantics
    - CCOS_causal_context_memory_and_replay_semantics
    - SciRust_Hub_runtime_component_registry_or_product_workflow_orchestration
    - repository_specific_scientific_runtime_financial_or_security_semantics
    - SciRust_Verify_general_evidence_dossier_verdict_semantics

repository_policy_contract:
  target: mandatory
  required_inputs:
    - repository_default_branch_and_exact_base_SHA
    - root_AGENTS_md_when_present
    - any_mandatory_off_main_roadmap_referenced_by_AGENTS_md
    - repository_specific_validation_and_merge_gates
    - human_only_or_forbidden_autonomous_actions
  behavior:
    - fetch_policy_before_issue_or_PR_agent_execution
    - persist_policy_identity_with_work_item_state
    - re_read_policy_before_publication_and_merge_if_repository_head_or_policy_changed
    - fail_closed_when_mandatory_policy_cannot_be_loaded
    - never_infer_permission_from_absence_of_a_generic_block_when_repository_policy_requires_explicit_authorization

ecosystem_interfaces:
  Memorithm/SoulSystem:
    relationship: canonical_or_optional_coding_agent_backend
    status: planned_versioned_backend
    contract:
      - Orchestrator_owns_repository_work_item_publication_and_CI_lifecycle
      - SoulSystem_owns_inner_coding_session_worktree_tools_and_acceptance_check_execution
      - backend_result_is_evidence_not_permission_to_push_or_merge
  Memorithm/CCOS-Core:
    relationship: optional_context_memory_and_postmortem_backend
    status: planned
    contract:
      - CCOS_context_is_bound_to_exact_repository_worktree_and_work_item_identity
      - Orchestrator_remains_authoritative_for_GitHub_state
  Memorithm/SciRust-Verify:
    relationship: development_evidence_sealing_partner
    status: planned
    contract:
      - seal_task_policy_diff_validation_CI_and_publication_evidence_without_replacing_Orchestrator_scheduler_state
  Memorithm/scirust-hub:
    relationship: separate_runtime_product_control_plane
    status: explicit_non_overlap
    rule: Orchestrator_manages_GitHub_development_Hub_manages_runtime_components_workflows_and_artifacts
  Memorithm/ElasticXxx:
    relationship: future_host_resource_admission_partner
    status: planned_not_assumed
    rule: Elastic_may_optimize_local_compute_memory_concurrency_but_cannot_override_repository_or_CI_gates

