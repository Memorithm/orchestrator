name: Temporary ORCH2a patch

on:
  push:
    branches:
      - feat/orch2a-validation-plan-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation sandbox dependency
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Apply exact ORCH2a transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(data, old, new, label):
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return data.replace(old, new, 1)

          policy_path = Path('src/policy.rs')
          policy = policy_path.read_text()

          marker = '''struct MergeEvidenceRule {\n    required: MergeEvidenceClass,\n    source_ref: String,\n    source_path: String,\n    source_commit: String,\n    source_blob: String,\n}\n'''
          addition = marker + '''\nconst MAX_VALIDATION_STEPS: usize = 24;\nconst MAX_VALIDATION_ARGV: usize = 32;\nconst MAX_VALIDATION_ARG_CHARS: usize = 512;\nconst MAX_VALIDATION_CWD_CHARS: usize = 256;\nconst MAX_VALIDATION_TIMEOUT_SECS: u64 = 3_600;\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub(crate) struct PortableValidationStep {\n    pub(crate) id: String,\n    pub(crate) argv: Vec<String>,\n    pub(crate) cwd: String,\n    pub(crate) timeout_seconds: u64,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub(crate) struct PortableValidationPlan {\n    pub(crate) steps: Vec<PortableValidationStep>,\n    pub(crate) source_ref: String,\n    pub(crate) source_path: String,\n    pub(crate) source_commit: String,\n    pub(crate) source_blob: String,\n}\n'''
          policy = replace_once(policy, marker, addition, 'validation plan types')

          method_marker = '''    pub(crate) fn base_branch(&self) -> &str {\n        &self.base_branch\n    }\n'''
          method = '''    pub(crate) fn portable_validation_plan(\n        &self,\n    ) -> Result<Option<PortableValidationPlan>, String> {\n        let mut selected = None;\n        for document in &self.documents {\n            let Some(plan) = parse_validation_plan(document)? else {\n                continue;\n            };\n            if selected.replace(plan).is_some() {\n                return Err(\n                    "duplicate validation_plan across mandatory policy documents".to_owned(),\n                );\n            }\n        }\n        Ok(selected)\n    }\n\n'''
          policy = replace_once(policy, method_marker, method + method_marker, 'validation plan method')

          parser_marker = '''fn parse_merge_evidence_policy(\n    document: &PolicyDocument,\n) -> Result<Option<MergeEvidenceRule>, String> {\n'''
          parser = '''fn parse_validation_argv(raw: &str) -> Result<Vec<String>, String> {\n    let raw = raw.trim();\n    if !raw.starts_with('[') || !raw.ends_with(']') {\n        return Err("validation argv must use a bracketed scalar list".to_owned());\n    }\n    let inner = &raw[1..raw.len() - 1];\n    if inner.trim().is_empty() {\n        return Err("validation argv must not be empty".to_owned());\n    }\n    let mut argv = Vec::new();\n    for raw_arg in inner.split(',') {\n        if argv.len() >= MAX_VALIDATION_ARGV {\n            return Err(format!(\n                "validation argv exceeds {MAX_VALIDATION_ARGV} elements"\n            ));\n        }\n        let arg = parse_policy_scalar(raw_arg.trim(), "validation argv")?;\n        if arg.is_empty()\n            || arg.chars().count() > MAX_VALIDATION_ARG_CHARS\n            || arg.chars().any(char::is_control)\n        {\n            return Err("invalid validation argv element".to_owned());\n        }\n        argv.push(arg);\n    }\n    let executable = argv.first().expect("non-empty checked above");\n    if executable.contains('/')\n        || executable.contains('\\\\')\n        || !executable.chars().all(|character| {\n            character.is_ascii_alphanumeric() || matches!(character, '-' | '_' | '.' | '+')\n        })\n    {\n        return Err(format!("unsafe validation executable: {executable:?}"));\n    }\n    if matches!(\n        executable.as_str(),\n        "git"\n            | "gh"\n            | "ssh"\n            | "scp"\n            | "curl"\n            | "wget"\n            | "bash"\n            | "sh"\n            | "zsh"\n            | "fish"\n            | "sudo"\n            | "su"\n            | "env"\n            | "xargs"\n            | "ollama"\n            | "opencode"\n    ) {\n        return Err(format!(\n            "validation executable is forbidden in portable plan v1: {executable}"\n        ));\n    }\n    Ok(argv)\n}\n\nfn validate_validation_cwd(value: &str) -> Result<String, String> {\n    let value = value.trim();\n    if value == "." {\n        return Ok(value.to_owned());\n    }\n    if value.is_empty()\n        || value.chars().count() > MAX_VALIDATION_CWD_CHARS\n        || value.starts_with('/')\n        || value.ends_with('/')\n        || value.contains('\\\\')\n        || value.contains(':')\n        || value.chars().any(char::is_control)\n    {\n        return Err(format!("unsafe validation cwd: {value:?}"));\n    }\n    for component in value.split('/') {\n        if component.is_empty() || matches!(component, "." | "..") {\n            return Err(format!("unsafe validation cwd: {value:?}"));\n        }\n    }\n    Ok(value.to_owned())\n}\n\nfn parse_validation_plan(\n    document: &PolicyDocument,\n) -> Result<Option<PortableValidationPlan>, String> {\n    #[derive(Default)]\n    struct PendingStep {\n        id: Option<String>,\n        argv: Option<Vec<String>>,\n        cwd: Option<String>,\n        timeout_seconds: Option<u64>,\n    }\n\n    fn finish_step(\n        pending: &mut Option<PendingStep>,\n        seen_ids: &mut BTreeSet<String>,\n        steps: &mut Vec<PortableValidationStep>,\n        document: &PolicyDocument,\n    ) -> Result<(), String> {\n        let Some(step) = pending.take() else {\n            return Ok(());\n        };\n        if steps.len() >= MAX_VALIDATION_STEPS {\n            return Err(format!(\n                "validation plan exceeds {MAX_VALIDATION_STEPS} steps in origin/{}:{}",\n                document.ref_name, document.path\n            ));\n        }\n        let id = step.id.ok_or_else(|| "validation step is missing id".to_owned())?;\n        let argv = step.argv.ok_or_else(|| format!("validation step {id} is missing argv"))?;\n        let cwd = step.cwd.unwrap_or_else(|| ".".to_owned());\n        let timeout_seconds = step.timeout_seconds.unwrap_or(300);\n        if !seen_ids.insert(id.clone()) {\n            return Err(format!("duplicate validation step id: {id}"));\n        }\n        steps.push(PortableValidationStep {\n            id,\n            argv,\n            cwd,\n            timeout_seconds,\n        });\n        Ok(())\n    }\n\n    let mut in_plan = false;\n    let mut in_steps = false;\n    let mut saw_section = false;\n    let mut schema_version = None;\n    let mut class = None;\n    let mut pending_step: Option<PendingStep> = None;\n    let mut seen_ids = BTreeSet::new();\n    let mut steps = Vec::new();\n\n    for raw_line in document.content.lines() {\n        let raw_line = raw_line.trim_end_matches('\\r');\n        let trimmed = raw_line.trim();\n        if trimmed.is_empty() || trimmed.starts_with('#') {\n            continue;\n        }\n        if !in_plan {\n            if raw_line == "validation_plan:" {\n                if saw_section {\n                    return Err(format!(\n                        "duplicate validation_plan section in origin/{}:{}",\n                        document.ref_name, document.path\n                    ));\n                }\n                in_plan = true;\n                saw_section = true;\n            }\n            continue;\n        }\n        if raw_line.starts_with('\\t') {\n            return Err(format!(\n                "tab indentation is not allowed in validation_plan origin/{}:{}",\n                document.ref_name, document.path\n            ));\n        }\n        let indent = raw_line.len() - raw_line.trim_start_matches(' ').len();\n        if indent == 0 {\n            finish_step(&mut pending_step, &mut seen_ids, &mut steps, document)?;\n            in_plan = false;\n            in_steps = false;\n            if raw_line == "validation_plan:" {\n                return Err(format!(\n                    "duplicate validation_plan section in origin/{}:{}",\n                    document.ref_name, document.path\n                ));\n            }\n            continue;\n        }\n        if indent == 2 {\n            finish_step(&mut pending_step, &mut seen_ids, &mut steps, document)?;\n            in_steps = false;\n            let (key, raw_value) = trimmed.split_once(':').ok_or_else(|| {\n                format!(\n                    "malformed validation_plan field in origin/{}:{}",\n                    document.ref_name, document.path\n                )\n            })?;\n            match key {\n                "schema_version" => {\n                    let value = parse_policy_scalar(raw_value.trim(), key)?;\n                    if schema_version.replace(value.clone()).is_some() {\n                        return Err("duplicate validation_plan schema_version".to_owned());\n                    }\n                    if value != "1" {\n                        return Err(format!(\n                            "unsupported validation_plan schema_version {value}"\n                        ));\n                    }\n                }\n                "class" => {\n                    let value = parse_policy_scalar(raw_value.trim(), key)?;\n                    if class.replace(value.clone()).is_some() {\n                        return Err("duplicate validation_plan class".to_owned());\n                    }\n                    if value != "portable" {\n                        return Err(format!("unsupported validation_plan class: {value}"));\n                    }\n                }\n                "steps" if raw_value.trim().is_empty() => in_steps = true,\n                other => {\n                    return Err(format!("unknown validation_plan field: {other}"));\n                }\n            }\n            continue;\n        }\n        if indent == 4 && trimmed.starts_with("- ") {\n            if !in_steps {\n                return Err("validation step declared outside steps".to_owned());\n            }\n            finish_step(&mut pending_step, &mut seen_ids, &mut steps, document)?;\n            let rest = trimmed.trim_start_matches("- ");\n            let (key, raw_value) = rest\n                .split_once(':')\n                .ok_or_else(|| "malformed validation step declaration".to_owned())?;\n            if key != "id" {\n                return Err("validation step must begin with id".to_owned());\n            }\n            let id = parse_policy_scalar(raw_value.trim(), "validation step id")?;\n            if id.is_empty()\n                || id.len() > 64\n                || !id.chars().all(|character| {\n                    character.is_ascii_alphanumeric() || matches!(character, '-' | '_' | '.')\n                })\n            {\n                return Err(format!("invalid validation step id: {id:?}"));\n            }\n            pending_step = Some(PendingStep {\n                id: Some(id),\n                ..PendingStep::default()\n            });\n            continue;\n        }\n        if indent == 6 && in_steps {\n            let step = pending_step\n                .as_mut()\n                .ok_or_else(|| "validation step field appears before id".to_owned())?;\n            let (key, raw_value) = trimmed\n                .split_once(':')\n                .ok_or_else(|| "malformed validation step field".to_owned())?;\n            match key {\n                "argv" => {\n                    if step.argv.is_some() {\n                        return Err("duplicate validation step argv".to_owned());\n                    }\n                    step.argv = Some(parse_validation_argv(raw_value.trim())?);\n                }\n                "cwd" => {\n                    if step.cwd.is_some() {\n                        return Err("duplicate validation step cwd".to_owned());\n                    }\n                    let value = parse_policy_scalar(raw_value.trim(), key)?;\n                    step.cwd = Some(validate_validation_cwd(&value)?);\n                }\n                "timeout_seconds" => {\n                    if step.timeout_seconds.is_some() {\n                        return Err("duplicate validation step timeout_seconds".to_owned());\n                    }\n                    let value = parse_policy_scalar(raw_value.trim(), key)?;\n                    let timeout = value.parse::<u64>().map_err(|_| {\n                        format!("invalid validation timeout_seconds: {value}")\n                    })?;\n                    if timeout == 0 || timeout > MAX_VALIDATION_TIMEOUT_SECS {\n                        return Err(format!(\n                            "validation timeout_seconds must be within 1..={MAX_VALIDATION_TIMEOUT_SECS}"\n                        ));\n                    }\n                    step.timeout_seconds = Some(timeout);\n                }\n                other => return Err(format!("unknown validation step field: {other}")),\n            }\n            continue;\n        }\n        return Err(format!(\n            "unsupported validation_plan indentation or structure in origin/{}:{}",\n            document.ref_name, document.path\n        ));\n    }\n\n    if !saw_section {\n        return Ok(None);\n    }\n    finish_step(&mut pending_step, &mut seen_ids, &mut steps, document)?;\n    if schema_version.as_deref() != Some("1") {\n        return Err("validation_plan requires schema_version: 1".to_owned());\n    }\n    if class.as_deref() != Some("portable") {\n        return Err("validation_plan requires class: portable".to_owned());\n    }\n    if steps.is_empty() {\n        return Err("validation_plan requires at least one step".to_owned());\n    }\n    Ok(Some(PortableValidationPlan {\n        steps,\n        source_ref: document.ref_name.clone(),\n        source_path: document.path.clone(),\n        source_commit: document.commit_sha.clone(),\n        source_blob: document.blob_sha.clone(),\n    }))\n}\n\n'''
          policy = replace_once(policy, parser_marker, parser + parser_marker, 'validation parser')

          test_marker = '''    #[test]\n    fn merge_evidence_policy_distinguishes_portable_hardware_and_human() {\n'''
          tests = '''    #[test]\n    fn portable_validation_plan_is_structured_and_bounded() {\n        let snapshot = snapshot_with_policy_documents(&[r#"validation_plan:\n  schema_version: 1\n  class: portable\n  steps:\n    - id: fmt\n      argv: [cargo, fmt, --all, --, --check]\n      cwd: .\n      timeout_seconds: 120\n    - id: tests\n      argv: [cargo, test, --workspace]\n      cwd: crates/core\n      timeout_seconds: 300\n"#]);\n        let plan = snapshot\n            .portable_validation_plan()\n            .unwrap()\n            .expect("portable plan");\n        assert_eq!(plan.steps.len(), 2);\n        assert_eq!(plan.steps[0].id, "fmt");\n        assert_eq!(plan.steps[0].argv[0], "cargo");\n        assert_eq!(plan.steps[1].cwd, "crates/core");\n        assert_eq!(plan.steps[1].timeout_seconds, 300);\n        assert_eq!(plan.source_ref, "agent/policy-0");\n    }\n\n    #[test]\n    fn validation_plan_rejects_shell_unsafe_or_ambiguous_structure() {\n        for content in [\n            "validation_plan:\\n  schema_version: 2\\n  class: portable\\n  steps:\\n    - id: x\\n      argv: [cargo, check]\\n",\n            "validation_plan:\\n  schema_version: 1\\n  class: hardware\\n  steps:\\n    - id: x\\n      argv: [cargo, check]\\n",\n            "validation_plan:\\n  schema_version: 1\\n  class: portable\\n  steps:\\n    - id: x\\n      argv: [bash, -c, echo bad]\\n",\n            "validation_plan:\\n  schema_version: 1\\n  class: portable\\n  steps:\\n    - id: x\\n      argv: [../tool]\\n",\n            "validation_plan:\\n  schema_version: 1\\n  class: portable\\n  steps:\\n    - id: x\\n      argv: [cargo, check]\\n      cwd: ../outside\\n",\n            "validation_plan:\\n  schema_version: 1\\n  class: portable\\n  steps:\\n    - id: x\\n      argv: [cargo, check]\\n    - id: x\\n      argv: [cargo, test]\\n",\n            "validation_plan:\\n  schema_version: 1\\n  class: portable\\n  unknown: value\\n  steps:\\n    - id: x\\n      argv: [cargo, check]\\n",\n        ] {\n            assert!(snapshot_with_policy_documents(&[content])\n                .portable_validation_plan()\n                .is_err());\n        }\n        let duplicate = snapshot_with_policy_documents(&[\n            "validation_plan:\\n  schema_version: 1\\n  class: portable\\n  steps:\\n    - id: x\\n      argv: [cargo, check]\\n",\n            "validation_plan:\\n  schema_version: 1\\n  class: portable\\n  steps:\\n    - id: y\\n      argv: [cargo, test]\\n",\n        ]);\n        assert!(duplicate.portable_validation_plan().is_err());\n    }\n\n    #[test]\n    fn validation_plan_is_not_inferred_from_free_text() {\n        let snapshot = snapshot_with_policy_documents(&[r#"notes: >-\n  validation_plan: cargo test --workspace\n"#]);\n        assert!(snapshot.portable_validation_plan().unwrap().is_none());\n    }\n\n'''
          policy = replace_once(policy, test_marker, tests + test_marker, 'validation parser tests')
          policy_path.write_text(policy)

          main_path = Path('src/main.rs')
          main = main_path.read_text()
          main = replace_once(main,
              'use std::time::{Duration, SystemTime, UNIX_EPOCH};',
              'use std::time::{Duration, Instant, SystemTime, UNIX_EPOCH};',
              'Instant import')

          old_validation = '''fn validate_workspace(config: &RunConfig, workspace: &Path) -> Result<(), String> {\n    println!();\n    println!("===== ORCHESTRATOR VALIDATION =====");\n    run_in_dir(workspace, "git", &["diff", "--check"])?;\n    if workspace.join("Cargo.toml").is_file() {\n        run_in_dir(workspace, "cargo", &["fmt", "--all", "--", "--check"])?;\n        run_in_dir(workspace, "cargo", &["check", "--workspace"])?;\n        run_in_dir(\n            workspace,\n            "cargo",\n            &[\n                "clippy",\n                "--workspace",\n                "--all-targets",\n                "--",\n                "-D",\n                "warnings",\n            ],\n        )?;\n        if config.full_validation {\n            run_in_dir(workspace, "cargo", &["test", "--workspace"])?;\n        }\n    }\n    Ok(())\n}\n'''
          new_validation = '''fn validation_safe_component(value: &str) -> String {\n    value\n        .chars()\n        .map(|character| {\n            if character.is_ascii_alphanumeric() || matches!(character, '-' | '_') {\n                character\n            } else {\n                '_'\n            }\n        })\n        .collect()\n}\n\nfn hex_bytes(value: &str) -> String {\n    use std::fmt::Write as _;\n    let mut encoded = String::with_capacity(value.len().saturating_mul(2));\n    for byte in value.as_bytes() {\n        let _ = write!(encoded, "{byte:02x}");\n    }\n    encoded\n}\n\nfn persist_validation_step_evidence(\n    config: &RunConfig,\n    item: &WorkItem,\n    snapshot: &policy::PolicySnapshot,\n    plan: &policy::PortableValidationPlan,\n    step: &policy::PortableValidationStep,\n    worktree_head: &str,\n    started_at: u64,\n    finished_at: u64,\n    exit_code: Option<i32>,\n    timed_out: bool,\n) -> Result<PathBuf, String> {\n    let directory = config\n        .data_root\n        .join("state/validation-evidence")\n        .join(item.repository.replace('/', "__"))\n        .join(format!("{}-{}", item.kind.as_str(), item.number));\n    fs::create_dir_all(&directory).map_err(|error| {\n        format!(\n            "failed to create validation evidence directory {}: {error}",\n            directory.display()\n        )\n    })?;\n    let argv_hex = step\n        .argv\n        .iter()\n        .map(|arg| hex_bytes(arg))\n        .collect::<Vec<_>>()\n        .join(",");\n    let record = format!(\n        "validation-schema=1\\nclass=portable\\nrepository={}\\nwork-kind={}\\nwork-number={}\\nstep-id={}\\nargv-hex={}\\ncwd={}\\ntimeout-seconds={}\\nstarted-at={}\\nfinished-at={}\\nexit-code={}\\ntimed-out={}\\npolicy-identity={}\\nbase-sha={}\\nworktree-head={}\\nsource-ref=origin/{}\\nsource-path={}\\nsource-commit={}\\nsource-blob={}\\n",\n        item.repository,\n        item.kind.as_str(),\n        item.number,\n        step.id,\n        argv_hex,\n        step.cwd,\n        step.timeout_seconds,\n        started_at,\n        finished_at,\n        exit_code.map_or_else(|| "none".to_owned(), |code| code.to_string()),\n        timed_out,\n        snapshot.identity_token(),\n        snapshot.base_sha(),\n        worktree_head,\n        plan.source_ref,\n        plan.source_path,\n        plan.source_commit,\n        plan.source_blob\n    );\n    for sequence in 0..1_024_u16 {\n        let path = directory.join(format!(\n            "{}-{}-{}-{}.txt",\n            started_at,\n            std::process::id(),\n            validation_safe_component(&step.id),\n            sequence\n        ));\n        let mut file = match OpenOptions::new()\n            .create_new(true)\n            .write(true)\n            .open(&path)\n        {\n            Ok(file) => file,\n            Err(error) if error.kind() == std::io::ErrorKind::AlreadyExists => continue,\n            Err(error) => {\n                return Err(format!(\n                    "failed to create validation evidence {}: {error}",\n                    path.display()\n                ));\n            }\n        };\n        file.write_all(record.as_bytes()).map_err(|error| {\n            format!("failed to write validation evidence {}: {error}", path.display())\n        })?;\n        file.sync_all().map_err(|error| {\n            format!("failed to sync validation evidence {}: {error}", path.display())\n        })?;\n        return Ok(path);\n    }\n    Err("validation evidence sequence exhausted for one step".to_owned())\n}\n\nfn resolve_validation_cwd(workspace: &Path, relative: &str) -> Result<PathBuf, String> {\n    let workspace = workspace.canonicalize().map_err(|error| {\n        format!("failed to canonicalize workspace {}: {error}", workspace.display())\n    })?;\n    let candidate = if relative == "." {\n        workspace.clone()\n    } else {\n        workspace.join(relative)\n    };\n    let candidate = candidate.canonicalize().map_err(|error| {\n        format!(\n            "failed to canonicalize validation cwd {}: {error}",\n            candidate.display()\n        )\n    })?;\n    if !candidate.starts_with(&workspace) {\n        return Err(format!(\n            "validation cwd escapes managed workspace: {}",\n            candidate.display()\n        ));\n    }\n    if !candidate.is_dir() {\n        return Err(format!("validation cwd is not a directory: {}", candidate.display()));\n    }\n    Ok(candidate)\n}\n\nfn run_portable_validation_step(\n    config: &RunConfig,\n    workspace: &Path,\n    item: &WorkItem,\n    snapshot: &policy::PolicySnapshot,\n    plan: &policy::PortableValidationPlan,\n    step: &policy::PortableValidationStep,\n    worktree_head: &str,\n) -> Result<(), String> {\n    let cwd = resolve_validation_cwd(workspace, &step.cwd)?;\n    let workspace_root = workspace.canonicalize().map_err(|error| {\n        format!("failed to canonicalize workspace {}: {error}", workspace.display())\n    })?;\n    let executable = step\n        .argv\n        .first()\n        .ok_or_else(|| format!("validation step {} has empty argv", step.id))?;\n    let mut command = Command::new("bwrap");\n    command\n        .args([\n            "--die-with-parent",\n            "--unshare-user",\n            "--uid",\n            "0",\n            "--gid",\n            "0",\n            "--unshare-pid",\n            "--unshare-ipc",\n            "--unshare-uts",\n            "--unshare-cgroup-try",\n            "--unshare-net",\n            "--cap-drop",\n            "ALL",\n            "--ro-bind",\n            "/",\n            "/",\n            "--bind",\n        ])\n        .arg(&workspace_root)\n        .arg(&workspace_root)\n        .args(["--proc", "/proc", "--dev", "/dev", "--chdir"])\n        .arg(&cwd)\n        .arg("--")\n        .arg(executable)\n        .args(step.argv.iter().skip(1))\n        .env_remove("GH_TOKEN")\n        .env_remove("GITHUB_TOKEN")\n        .env_remove("GITHUB_PAT")\n        .env_remove("OPENAI_API_KEY")\n        .env_remove("OLLAMA_HOST")\n        .env_remove("OPENCODE_CONFIG_CONTENT")\n        .env_remove("SSH_AUTH_SOCK");\n    println!("$ [portable:{}] {}", step.id, step.argv.join(" "));\n    let started_at = unix_timestamp();\n    let started = Instant::now();\n    let mut child = command\n        .spawn()\n        .map_err(|error| format!("failed to spawn portable validation {}: {error}", step.id))?;\n    let timeout = Duration::from_secs(step.timeout_seconds);\n    let (status, timed_out) = loop {\n        match child\n            .try_wait()\n            .map_err(|error| format!("failed to poll validation {}: {error}", step.id))?\n        {\n            Some(status) => break (status, false),\n            None if started.elapsed() >= timeout => {\n                child\n                    .kill()\n                    .map_err(|error| format!("failed to kill timed-out validation {}: {error}", step.id))?;\n                let status = child.wait().map_err(|error| {\n                    format!("failed to reap timed-out validation {}: {error}", step.id)\n                })?;\n                break (status, true);\n            }\n            None => thread::sleep(Duration::from_millis(50)),\n        }\n    };\n    let finished_at = unix_timestamp();\n    let evidence = persist_validation_step_evidence(\n        config,\n        item,\n        snapshot,\n        plan,\n        step,\n        worktree_head,\n        started_at,\n        finished_at,\n        status.code(),\n        timed_out,\n    )?;\n    println!("validation evidence: {}", evidence.display());\n    if timed_out {\n        return Err(format!(\n            "portable validation step {} timed out after {} seconds",\n            step.id, step.timeout_seconds\n        ));\n    }\n    if !status.success() {\n        return Err(format!(\n            "portable validation step {} failed with {status}",\n            step.id\n        ));\n    }\n    Ok(())\n}\n\nfn validate_workspace(\n    config: &RunConfig,\n    workspace: &Path,\n    item: &WorkItem,\n    snapshot: &policy::PolicySnapshot,\n) -> Result<(), String> {\n    println!();\n    println!("===== ORCHESTRATOR VALIDATION =====");\n    run_in_dir(workspace, "git", &["diff", "--check"])?;\n    if let Some(plan) = snapshot.portable_validation_plan()? {\n        let worktree_head = capture_in_dir(workspace, "git", &["rev-parse", "HEAD"])?;\n        for step in &plan.steps {\n            run_portable_validation_step(\n                config,\n                workspace,\n                item,\n                snapshot,\n                &plan,\n                step,\n                &worktree_head,\n            )?;\n        }\n        return Ok(());\n    }\n    if workspace.join("Cargo.toml").is_file() {\n        run_in_dir(workspace, "cargo", &["fmt", "--all", "--", "--check"])?;\n        run_in_dir(workspace, "cargo", &["check", "--workspace"])?;\n        run_in_dir(\n            workspace,\n            "cargo",\n            &[\n                "clippy",\n                "--workspace",\n                "--all-targets",\n                "--",\n                "-D",\n                "warnings",\n            ],\n        )?;\n        if config.full_validation {\n            run_in_dir(workspace, "cargo", &["test", "--workspace"])?;\n        }\n    }\n    Ok(())\n}\n'''
          main = replace_once(main, old_validation, new_validation, 'validate_workspace replacement')

          old_recovered = '''fn validate_recovered_publication(\n    config: &RunConfig,\n    workspace: &Path,\n    base_branch: &str,\n) -> Result<(), String> {\n    let base_ref = format!("origin/{base_branch}");\n    let range = format!("{base_ref}...HEAD");\n    run_in_dir(workspace, "git", &["diff", "--check", range.as_str()])?;\n    validate_canonical_author_range(workspace, &base_ref)?;\n    reject_sensitive_committed_paths(workspace, &base_ref)?;\n    validate_workspace(config, workspace)\n}\n'''
          new_recovered = '''fn validate_recovered_publication(\n    config: &RunConfig,\n    workspace: &Path,\n    base_branch: &str,\n    item: &WorkItem,\n    snapshot: &policy::PolicySnapshot,\n) -> Result<(), String> {\n    let base_ref = format!("origin/{base_branch}");\n    let range = format!("{base_ref}...HEAD");\n    run_in_dir(workspace, "git", &["diff", "--check", range.as_str()])?;\n    validate_canonical_author_range(workspace, &base_ref)?;\n    reject_sensitive_committed_paths(workspace, &base_ref)?;\n    validate_workspace(config, workspace, item, snapshot)\n}\n'''
          main = replace_once(main, old_recovered, new_recovered, 'recovered validation signature')

