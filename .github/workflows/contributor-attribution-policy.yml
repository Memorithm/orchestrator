name: Contributor attribution policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  canonical-attribution:
    name: Enforce canonical author
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit attribution
        shell: bash
        env:
          CANONICAL_AUTHOR_IDENTITIES: |
            ZEKRITI Tarek <194770978+CHECKUPAUTO@users.noreply.github.com>
            MEMOPERF <contact@checkupauto.fr>
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          scripts/check-contributor-attribution.sh "$base" "$head" "${{ github.event_name }}"
