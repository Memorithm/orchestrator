name: Temporary ORCH0 policy hardening v2

on:
  push:
    branches:
      - feat/orch0-policy-bootstrap-v1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact function-level hardening
        shell: bash
        run: |
          printf '%s' '' | base64 -d | python3

      - name: Validate hardening
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name 'ZEKRITI Tarek'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add src/policy.rs
          git diff --cached --check
          git commit -m 'test(policy): harden repeated evidence and default branches'
          git push origin HEAD:feat/orch0-policy-bootstrap-v1
