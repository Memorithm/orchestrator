name: Temporary ORCH6b roadmap staging

on:
  push:
    branches: [agent/ecosystem-roadmap-orch6b-staging]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply roadmap patch
        run: python3 tools/roadmap-orch6b-patch.py
      - name: Commit roadmap product only
        run: |
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add .agent/ORCHESTRATOR_ECOSYSTEM_ROADMAP.yaml
          git diff --cached --quiet && { echo "no roadmap changes generated"; exit 1; }
          git commit -m "docs(roadmap): complete ORCH6b and activate ORCH6c"
          git push origin HEAD:agent/ecosystem-roadmap-orch6b-staging
