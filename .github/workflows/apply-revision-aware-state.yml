name: integrate revision-aware retry state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-revision-aware-state.yml

permissions:
  contents: write

concurrency:
  group: orchestrator-revision-aware-state-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic revision patches
        run: |
          python3 tools/apply-revision-aware-state.py
          python3 tools/finalize-revision-aware-state.py

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format integrated sources
        run: cargo fmt --all

      - name: Validate runtime shell
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh
          bash scripts/selftest-runtime.sh
          bash scripts/selftest-opencode-watchdog.sh

      - name: Verify systemd sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/orchestrator-data"
          touch "$RUNNER_TEMP/orchestrator.env"
          bash scripts/render-systemd-unit.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/orchestrator-data" \
            "$RUNNER_TEMP/orchestrator.env" \
            > "$RUNNER_TEMP/memorithm-orchestrator.service"
          systemd-analyze verify "$RUNNER_TEMP/memorithm-orchestrator.service"

      - name: Validate revision-aware scheduler
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Enforce patch scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/main\.rs|src/state\.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected integration paths:\n%s\n' "$unexpected" >&2
            false
          fi
          printf '%s\n' "$changed" | grep -qx 'src/main.rs'
          printf '%s\n' "$changed" | grep -qx 'src/state.rs'

      - name: Commit validated revision state
        run: |
          git config user.name 'Memorithm Orchestrator Integration'
          git config user.email 'orchestrator@localhost'
          git add src/main.rs src/state.rs
          git commit -m 'feat(scheduler): reset retry state on new PR revision'
          git push origin HEAD:main
