name: Temporary ORCH2a execution tests

on:
  push:
    branches:
      - feat/orch2a-exec-tests-staging

permissions:
  contents: write

jobs:
  harden-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation sandbox dependency
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Add ORCH2a execution coverage
        run: python3 .github/orch2a-exec-tests.py
      - name: Validate hardened ORCH2a source
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit validated source only
        shell: bash
        run: |
          git config user.name 'ZEKRITI Tarek'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add src/main.rs src/policy.rs
          git diff --cached --check
          git commit -m 'test(validation): cover portable plan execution'
          git push origin HEAD:feat/orch2a-exec-tests-staging
