name: Temporary ORCH6d retention staging

on:
  push:
    branches: [feat/orch6d-retention-staging]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded audit retention
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/hardware_capability.rs')
          s = p.read_text()
          old = 'const MAX_AUDIT_BYTES: usize = 96 * 1024;\n'
          new = old + 'const MAX_AUDIT_RECORDS_PER_BINDING: usize = 256;\nconst MAX_AUDIT_SCAN_ENTRIES: usize = 512;\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '    ensure_managed_directory(record.request.data_root, &state_root, &directory)?;\n\n    let configured_runners = if record.config.runners.is_empty() {'
          new = '    ensure_managed_directory(record.request.data_root, &state_root, &directory)?;\n    prune_audit_records(\n        &directory,\n        MAX_AUDIT_RECORDS_PER_BINDING.saturating_sub(1),\n    )?;\n\n    let configured_runners = if record.config.runners.is_empty() {'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = '\nfn ensure_managed_directory(\n'
          assert s.count(marker) == 1
          helper = r'''
fn prune_audit_records(directory: &Path, keep: usize) -> Result<(), String> {
    let mut records = Vec::new();
    let entries = fs::read_dir(directory)
        .map_err(|error| format!("failed to read hardware capability audit directory: {error}"))?;
    for (index, entry) in entries.enumerate() {
        if index >= MAX_AUDIT_SCAN_ENTRIES {
            return Err("hardware capability audit directory exceeds bounded scan limit".to_owned());
        }
        let entry = entry
            .map_err(|error| format!("failed to inspect hardware capability audit entry: {error}"))?;
        let file_type = entry.file_type().map_err(|error| {
            format!("failed to inspect hardware capability audit entry type: {error}")
        })?;
        if file_type.is_symlink() || !file_type.is_file() {
            return Err("hardware capability audit directory contains a non-regular entry".to_owned());
        }
        let name = entry
            .file_name()
            .into_string()
            .map_err(|_| "hardware capability audit filename is not UTF-8".to_owned())?;
        let key = parse_audit_filename(&name)?;
        records.push((key, entry.path()));
    }
    records.sort_by_key(|(key, _)| *key);
    let remove_count = records.len().saturating_sub(keep);
    for (_, path) in records.into_iter().take(remove_count) {
        fs::remove_file(&path).map_err(|error| {
            format!(
                "failed to prune retained hardware capability audit record {}: {error}",
                path.display()
            )
        })?;
    }
    Ok(())
}

fn parse_audit_filename(name: &str) -> Result<(u64, u32, u32), String> {
    let stem = name
        .strip_suffix(".state")
        .ok_or_else(|| "invalid hardware capability audit filename extension".to_owned())?;
    let mut parts = stem.split('-');
    let observed_at = parts
        .next()
        .ok_or_else(|| "invalid hardware capability audit filename".to_owned())?
        .parse::<u64>()
        .map_err(|_| "invalid hardware capability audit timestamp filename component".to_owned())?;
    let pid = parts
        .next()
        .ok_or_else(|| "invalid hardware capability audit filename".to_owned())?
        .parse::<u32>()
        .map_err(|_| "invalid hardware capability audit pid filename component".to_owned())?;
    let sequence = parts
        .next()
        .ok_or_else(|| "invalid hardware capability audit filename".to_owned())?
        .parse::<u32>()
        .map_err(|_| "invalid hardware capability audit sequence filename component".to_owned())?;
    if parts.next().is_some() || observed_at == 0 || pid == 0 || sequence >= 128 {
        return Err("invalid hardware capability audit filename".to_owned());
    }
    Ok((observed_at, pid, sequence))
}
'''
          s = s.replace(marker, '\n' + helper + marker, 1)

          marker = '    #[test]\n    fn runner_parser_rejects_ambiguous_or_malformed_encoded_metadata() {'
          assert s.count(marker) == 1
          tests = r'''    #[test]
    fn audit_retention_prunes_oldest_records_to_bound() {
        let root = temp_root("audit-retention");
        let directory = root.join("audit");
        fs::create_dir_all(&directory).unwrap();
        for observed_at in 1..=4u64 {
            fs::write(
                directory.join(format!("{observed_at}-1-0.state")),
                "fixture",
            )
            .unwrap();
        }
        prune_audit_records(&directory, 2).unwrap();
        let mut names = fs::read_dir(&directory)
            .unwrap()
            .map(|entry| entry.unwrap().file_name().into_string().unwrap())
            .collect::<Vec<_>>();
        names.sort();
        assert_eq!(names, ["3-1-0.state", "4-1-0.state"]);
        fs::remove_dir_all(root).unwrap();
    }

    #[cfg(unix)]
    #[test]
    fn audit_retention_rejects_symlink_entries() {
        use std::os::unix::fs::symlink;

        let root = temp_root("audit-retention-symlink");
        let directory = root.join("audit");
        fs::create_dir_all(&directory).unwrap();
        fs::write(root.join("outside"), "fixture").unwrap();
        symlink(root.join("outside"), directory.join("1-1-0.state")).unwrap();
        let error = prune_audit_records(&directory, 1).unwrap_err();
        assert!(error.contains("non-regular"));
        fs::remove_dir_all(root).unwrap();
    }

'''
          s = s.replace(marker, tests + marker, 1)
          p.write_text(s)
          PY
      - name: Validate shell scripts
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/agent-ollama
          bash -n scripts/agent-sandbox
          bash -n scripts/validation-sandbox
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/selftest-opencode-reaping.sh
          bash -n scripts/selftest-agent-sandbox.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh
      - name: Runtime bridge selftest
        run: bash scripts/selftest-runtime.sh
      - name: General agent watchdog selftest
        run: bash scripts/selftest-opencode-watchdog.sh
      - name: Agent process reaping selftest
        run: bash scripts/selftest-opencode-reaping.sh
      - name: Install process sandbox dependency
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
      - name: Agent process sandbox selftest
        run: sudo bash scripts/selftest-agent-sandbox.sh
      - name: Verify systemd sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/orchestrator-data"
          touch "$RUNNER_TEMP/orchestrator.env"
          bash scripts/render-systemd-unit.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/orchestrator-data" "$RUNNER_TEMP/orchestrator.env" > "$RUNNER_TEMP/memorithm-orchestrator.service"
          systemd-analyze verify "$RUNNER_TEMP/memorithm-orchestrator.service"
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format generated product
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Portable validation sandbox integration
        run: |
          cleanup_validation_secret() { sudo rm -f /root/.ssh/orchestrator-validation-ci-secret; }
          trap cleanup_validation_secret EXIT
          sudo mkdir -p /root/.ssh
          sudo touch /root/.ssh/orchestrator-validation-ci-secret
          runner_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          runner_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          sudo chmod o+x "$HOME"
          sudo chmod a+rx "$runner_cargo_home"
          if [[ -d "$runner_cargo_home/bin" ]]; then sudo chmod -R a+rX "$runner_cargo_home/bin"; fi
          if [[ -d "$runner_cargo_home/registry" ]]; then sudo chmod -R a+rX "$runner_cargo_home/registry"; fi
          if [[ -d "$runner_cargo_home/git" ]]; then sudo chmod -R a+rX "$runner_cargo_home/git"; fi
          sudo chmod -R a+rX "$runner_rustup_home"
          sudo env PATH="$PATH" HOME="/root" CARGO_HOME="$runner_cargo_home" RUSTUP_HOME="$runner_rustup_home" CARGO_TARGET_DIR="$RUNNER_TEMP/orch2-root-target" GITHUB_TOKEN="must-not-cross-validation-sandbox" ORCHESTRATOR_VALIDATION_SANDBOX="$GITHUB_WORKSPACE/scripts/validation-sandbox" ORCHESTRATOR_REAL_BWRAP="$(command -v bwrap)" cargo test --workspace portable_validation_ -- --nocapture
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit validated product only
        run: |
          git config user.name "ZEKRITI Tarek"
          git config user.email "194770978+CHECKUPAUTO@users.noreply.github.com"
          git add src/hardware_capability.rs
          git diff --cached --quiet && { echo "no retention product change"; exit 1; }
          git commit -m "fix(hardware): bound capability audit retention"
          git push origin HEAD:feat/orch6d-retention-staging
