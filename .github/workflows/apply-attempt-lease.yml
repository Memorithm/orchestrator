name: integrate crash-safe attempt leases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-attempt-lease.yml

permissions:
  contents: write

concurrency:
  group: orchestrator-attempt-lease-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic attempt lease patch
        run: python3 tools/apply-attempt-lease.py

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format integrated sources
        run: cargo fmt --all

      - name: Validate runtime shell
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh
          bash scripts/selftest-runtime.sh
          bash scripts/selftest-opencode-watchdog.sh

      - name: Validate crash-safe scheduler
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Enforce patch scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/main\.rs|src/state\.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected integration paths:\n%s\n' "$unexpected" >&2
            false
          fi
          test -n "$changed"

      - name: Commit validated attempt leases
        run: |
          git config user.name 'Memorithm Orchestrator Integration'
          git config user.email 'orchestrator@localhost'
          git add src/main.rs src/state.rs
          git commit -m 'feat(scheduler): recover interrupted attempts after restart'
          git push origin HEAD:main
