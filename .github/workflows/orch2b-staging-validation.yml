name: Temporary ORCH2b validation

on:
  push:
    branches: [feat/orch2b-validation-result-staging]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
      - name: Apply ORCH2b integration
        run: |
          python3 .github/orch2b-patch.py
          python3 .github/orch2b-patch-v2.py
          python3 .github/orch2b-patch-v3.py
          python3 .github/orch2b-patch-v4.py
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format generated product
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Portable validation sandbox integration as deployment root
        run: |
          cleanup_validation_secret() {
            sudo rm -f /root/.ssh/orchestrator-validation-ci-secret
          }
          trap cleanup_validation_secret EXIT
          sudo mkdir -p /root/.ssh
          sudo touch /root/.ssh/orchestrator-validation-ci-secret
          runner_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          runner_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          sudo chmod o+x "$HOME"
          sudo chmod a+rx "$runner_cargo_home"
          if [[ -d "$runner_cargo_home/bin" ]]; then sudo chmod -R a+rX "$runner_cargo_home/bin"; fi
          if [[ -d "$runner_cargo_home/registry" ]]; then sudo chmod -R a+rX "$runner_cargo_home/registry"; fi
          if [[ -d "$runner_cargo_home/git" ]]; then sudo chmod -R a+rX "$runner_cargo_home/git"; fi
          sudo chmod -R a+rX "$runner_rustup_home"
          sudo env \
            PATH="$PATH" \
            HOME="/root" \
            CARGO_HOME="$runner_cargo_home" \
            RUSTUP_HOME="$runner_rustup_home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/orch2b-root-target" \
            GITHUB_TOKEN="must-not-cross-validation-sandbox" \
            ORCHESTRATOR_VALIDATION_SANDBOX="$GITHUB_WORKSPACE/scripts/validation-sandbox" \
            ORCHESTRATOR_REAL_BWRAP="$(command -v bwrap)" \
            cargo test --workspace portable_validation_ -- --nocapture
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit validated product only
        run: |
          git config user.name "ZEKRITI Tarek"
          git config user.email "194770978+CHECKUPAUTO@users.noreply.github.com"
          git add src/main.rs src/validation_state.rs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git commit -m "feat(validation): persist terminal plan results"
          git push origin HEAD:feat/orch2b-validation-result-staging
