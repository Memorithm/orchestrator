name: integrate structured action outcomes

on:
  push:
    branches: [research/no-progress-outcomes-v2]
    paths:
      - tools/apply-action-outcomes.py
      - .github/workflows/apply-action-outcomes.yml

permissions:
  contents: write

concurrency:
  group: orchestrator-action-outcome-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize intentional duplicate deferrals in one-shot helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply-action-outcomes.py")
          source = path.read_text()
          old = '''    section = replace_once(
                  section,
                  ''' + "'''        return Ok(());\n'''" + ''',
                  ''' + "'''        return Ok(ActionOutcome::Deferred);\n'''" + ''',
                  "auto merge disabled deferred",
              )
              section = replace_once(
                  section,
                  ''' + "'''        return Ok(());\n'''" + ''',
                  ''' + "'''        return Ok(ActionOutcome::Deferred);\n'''" + ''',
                  "outside merge scope deferred",
              )
          '''
          new = '''    deferred_anchor = "        return Ok(());\\n"
              if section.count(deferred_anchor) != 2:
                  raise SystemExit(
                      f"pr attention deferred anchors: expected exactly 2, found {section.count(deferred_anchor)}"
                  )
              section = section.replace(
                  deferred_anchor,
                  "        return Ok(ActionOutcome::Deferred);\\n",
                  2,
              )
          '''
          if source.count(old) != 1:
              raise SystemExit(f"one-shot helper correction anchor count={source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Apply deterministic action-outcome patch
        run: |
          python3 tools/apply-action-outcomes.py
          git checkout -- tools/apply-action-outcomes.py

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format integrated sources
        run: cargo fmt --all

      - name: Install process sandbox dependency
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi

      - name: Validate runtime safety selftests
        run: |
          bash scripts/selftest-runtime.sh
          bash scripts/selftest-opencode-watchdog.sh
          sudo bash scripts/selftest-agent-sandbox.sh

      - name: Validate structured outcomes
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Enforce patch scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/main\.rs|src/state\.rs|src/health\.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected integration paths:\n%s\n' "$unexpected" >&2
            false
          fi
          printf '%s\n' "$changed" | grep -qx 'src/main.rs'
          printf '%s\n' "$changed" | grep -qx 'src/state.rs'
          printf '%s\n' "$changed" | grep -qx 'src/health.rs'

      - name: Commit validated structured outcomes
        run: |
          git config user.name 'Memorithm Orchestrator Integration'
          git config user.email 'orchestrator@localhost'
          git add src/main.rs src/state.rs src/health.rs
          git commit -m 'feat(runtime): distinguish progress no-progress and deferral'
          git push origin HEAD:research/no-progress-outcomes-v2
