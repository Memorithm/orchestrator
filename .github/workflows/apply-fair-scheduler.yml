name: integrate fair scheduler

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fair-scheduler.yml

permissions:
  contents: write

concurrency:
  group: orchestrator-fair-scheduler-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic fair scheduler patch
        run: python3 tools/apply-fair-scheduler.py

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format integrated sources
        run: cargo fmt --all

      - name: Validate runtime shell
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh
          bash scripts/selftest-runtime.sh
          bash scripts/selftest-opencode-watchdog.sh

      - name: Verify systemd sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/orchestrator-data"
          touch "$RUNNER_TEMP/orchestrator.env"
          bash scripts/render-systemd-unit.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/orchestrator-data" \
            "$RUNNER_TEMP/orchestrator.env" \
            > "$RUNNER_TEMP/memorithm-orchestrator.service"
          systemd-analyze verify "$RUNNER_TEMP/memorithm-orchestrator.service"

      - name: Validate fair scheduler
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Enforce patch scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "src/main.rs"

      - name: Commit validated fair scheduler
        run: |
          git config user.name 'Memorithm Orchestrator Integration'
          git config user.email 'orchestrator@localhost'
          git add src/main.rs
          git commit -m 'feat(scheduler): rotate fairly within work priority'
          git push origin HEAD:main
