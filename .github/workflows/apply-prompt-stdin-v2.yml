name: integrate private prompt stdin

on:
  push:
    branches:
      - fix/prompt-stdin

permissions:
  contents: write

concurrency:
  group: integrate-private-prompt-stdin
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-stdin
          fetch-depth: 0

      - name: Reuse previously validated wrapper changes
        run: |
          git fetch origin research/prompt-stdin-boundary
          git show origin/research/prompt-stdin-boundary:scripts/opencode > scripts/opencode
          git show origin/research/prompt-stdin-boundary:scripts/selftest-opencode-watchdog.sh > scripts/selftest-opencode-watchdog.sh
          chmod 755 scripts/opencode scripts/selftest-opencode-watchdog.sh

      - name: Apply current-main Rust transport patch
        run: python3 tools/apply_prompt_stdin_main.py

      - name: Validate shell syntax
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/agent-ollama
          bash -n scripts/agent-sandbox
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/selftest-agent-sandbox.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all

      - name: Install process sandbox dependency
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi

      - name: Runtime and privacy selftests
        run: |
          bash scripts/selftest-runtime.sh
          bash scripts/selftest-opencode-watchdog.sh
          sudo bash scripts/selftest-agent-sandbox.sh
          mkdir -p "$RUNNER_TEMP/orchestrator-data"
          touch "$RUNNER_TEMP/orchestrator.env"
          bash scripts/render-systemd-unit.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/orchestrator-data" \
            "$RUNNER_TEMP/orchestrator.env" \
            > "$RUNNER_TEMP/memorithm-orchestrator.service"
          systemd-analyze verify "$RUNNER_TEMP/memorithm-orchestrator.service"

      - name: Validate Rust
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Enforce integration scope
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/opencode scripts/selftest-opencode-watchdog.sh src/main.rs | sort)"
          test "$changed" = "$expected"

      - name: Commit validated product-only diff
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add src/main.rs scripts/opencode scripts/selftest-opencode-watchdog.sh
          git rm tools/apply_prompt_stdin_main.py .github/workflows/apply-prompt-stdin-v2.yml
          git commit -m "fix(agent): keep prompts out of process argv"
          git push origin HEAD:fix/prompt-stdin
