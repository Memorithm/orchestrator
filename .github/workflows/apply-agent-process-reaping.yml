name: integrate agent process reaping

on:
  push:
    branches:
      - fix/agent-process-reaping

permissions:
  contents: write

concurrency:
  group: integrate-agent-process-reaping
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-process-reaping
          fetch-depth: 0

      - name: Apply deterministic integration patch
        run: python3 tools/apply_agent_process_reaping.py

      - name: Validate shell syntax
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/agent-ollama
          bash -n scripts/agent-sandbox
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/selftest-opencode-reaping.sh
          bash -n scripts/selftest-agent-sandbox.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh

      - name: Runtime bridge selftest
        run: bash scripts/selftest-runtime.sh

      - name: General agent watchdog selftest
        run: bash scripts/selftest-opencode-watchdog.sh

      - name: Agent process reaping selftest
        run: bash scripts/selftest-opencode-reaping.sh

      - name: Install process sandbox dependency
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi

      - name: Agent process sandbox selftest
        run: sudo bash scripts/selftest-agent-sandbox.sh

      - name: Verify systemd sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/orchestrator-data"
          touch "$RUNNER_TEMP/orchestrator.env"
          bash scripts/render-systemd-unit.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/orchestrator-data" \
            "$RUNNER_TEMP/orchestrator.env" \
            > "$RUNNER_TEMP/memorithm-orchestrator.service"
          systemd-analyze verify "$RUNNER_TEMP/memorithm-orchestrator.service"
          grep -Fxq 'KillMode=control-group' "$RUNNER_TEMP/memorithm-orchestrator.service"
          grep -Fxq 'KillSignal=SIGINT' "$RUNNER_TEMP/memorithm-orchestrator.service"

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Diff check
        run: git diff --check

      - name: Product scope guard
        run: |
          changed="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' .github/workflows/ci.yml scripts/opencode scripts/render-systemd-unit.sh scripts/selftest-opencode-reaping.sh | sort)"
          product_changed="$(printf '%s\n' "$changed" | grep -v '^\.github/workflows/apply-agent-process-reaping.yml$' | grep -v '^tools/apply_agent_process_reaping.py$' || true)"
          test "$product_changed" = "$expected"

      - name: Commit validated product-only diff
        run: |
          rm tools/apply_agent_process_reaping.py .github/workflows/apply-agent-process-reaping.yml
          git fetch origin main
          final_changed="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' .github/workflows/ci.yml scripts/opencode scripts/render-systemd-unit.sh scripts/selftest-opencode-reaping.sh | sort)"
          test "$final_changed" = "$expected"
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add -A
          git commit -m "fix(runtime): reap autonomous agent process trees on shutdown"
          git push origin HEAD:fix/agent-process-reaping
