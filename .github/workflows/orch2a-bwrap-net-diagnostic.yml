name: Temporary ORCH2a bwrap network diagnostic

on:
  push:
    branches:
      - diagnostic/orch2a-bwrap-net

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Probe root deployment identity
        shell: bash
        run: |
          set +e
          echo '===== root_exact_portable_profile ====='
          sudo bwrap \
            --die-with-parent \
            --unshare-user \
            --uid 0 \
            --gid 0 \
            --unshare-pid \
            --unshare-ipc \
            --unshare-uts \
            --unshare-cgroup-try \
            --unshare-net \
            --cap-drop ALL \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            -- true
          echo "RESULT root_exact_portable_profile=$?"
          echo
          echo '===== root_agent_sandbox_selftest ====='
          sudo --preserve-env=PATH bash scripts/selftest-agent-sandbox.sh
          echo "RESULT root_agent_sandbox_selftest=$?"
          exit 0
