name: Temporary ORCH2a bwrap fd projection diagnostic

on:
  push:
    branches:
      - diagnostic/orch2a-bwrap-net

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Probe toolchain projection through inherited directory descriptors
        shell: bash
        run: |
          sudo env \
            HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            bash -euxo pipefail -c '
              exec {cargo_fd}<"$CARGO_HOME/bin"
              exec {rustup_fd}<"$RUSTUP_HOME"
              cargo_fd_path="/proc/self/fd/$cargo_fd"
              rustup_fd_path="/proc/self/fd/$rustup_fd"
              bwrap \
                --die-with-parent \
                --unshare-user \
                --uid 0 \
                --gid 0 \
                --unshare-pid \
                --unshare-ipc \
                --unshare-uts \
                --unshare-cgroup-try \
                --unshare-net \
                --cap-drop ALL \
                --ro-bind / / \
                --tmpfs "$HOME" \
                --tmpfs /tmp \
                --dir /tmp/toolchain \
                --dir /tmp/toolchain/cargo-bin \
                --dir /tmp/toolchain/rustup \
                --ro-bind "$cargo_fd_path" /tmp/toolchain/cargo-bin \
                --ro-bind "$rustup_fd_path" /tmp/toolchain/rustup \
                --clearenv \
                --setenv HOME /tmp \
                --setenv PATH /tmp/toolchain/cargo-bin:/usr/bin:/bin \
                --setenv RUSTUP_HOME /tmp/toolchain/rustup \
                -- \
                cargo --version
            '
