name: Temporary ORCH2a bwrap credential-mask diagnostic

on:
  push:
    branches:
      - diagnostic/orch2a-bwrap-net

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Probe nested credential masks
        shell: bash
        run: |
          set +e
          for path in \
            /home/runner/.docker \
            /home/runner/.ssh \
            /home/runner/.config/gh \
            /root/.ssh; do
            echo "===== PATH $path ====="
            sudo ls -ld "$path" 2>&1
            resolved="$(sudo realpath -e "$path" 2>/dev/null)"
            echo "resolved=$resolved"
            if [[ -n "$resolved" && -d "$resolved" ]]; then
              sudo bwrap \
                --die-with-parent \
                --unshare-user --uid 0 --gid 0 \
                --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --unshare-net \
                --cap-drop ALL \
                --ro-bind / / \
                --tmpfs "$resolved" \
                -- true
              echo "mask_result=$?"
            fi
            echo
          done
          exit 0
