name: Temporary ORCH1a post-review validation

on:
  push:
    branches:
      - staging/orch1a-task-eligibility

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply post-review fix
        run: python3 scripts/orch1a-postreview-fix.py

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit validated post-review fix
        run: |
          git config user.name 'ZEKRITI Tarek'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add src/policy.rs
          git diff --cached --check
          git commit -m 'fix(policy): require explicit body target for roadmap denial'
          git push origin HEAD:staging/orch1a-task-eligibility
