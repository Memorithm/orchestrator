name: integrate fail-closed stale workspace GC

on:
  push:
    branches:
      - feat/stale-workspace-gc

permissions:
  contents: write

concurrency:
  group: integrate-stale-workspace-gc
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stale-workspace-gc
          fetch-depth: 0

      - name: Apply deterministic integration patch
        run: python3 tools/apply_stale_workspace_gc.py

      - name: Validate shell syntax
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/agent-ollama
          bash -n scripts/agent-sandbox
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/selftest-agent-sandbox.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh

      - name: Runtime bridge selftest
        run: bash scripts/selftest-runtime.sh

      - name: General agent watchdog selftest
        run: bash scripts/selftest-opencode-watchdog.sh

      - name: Install process sandbox dependency
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi

      - name: Agent process sandbox selftest
        run: sudo bash scripts/selftest-agent-sandbox.sh

      - name: Verify systemd sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/orchestrator-data"
          touch "$RUNNER_TEMP/orchestrator.env"
          bash scripts/render-systemd-unit.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/orchestrator-data" \
            "$RUNNER_TEMP/orchestrator.env" \
            > "$RUNNER_TEMP/memorithm-orchestrator.service"
          systemd-analyze verify "$RUNNER_TEMP/memorithm-orchestrator.service"

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all

      - name: Scope guard before validation
        run: |
          changed="$(git diff --name-only | sort)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              README.md|scripts/install-systemd.sh|scripts/start.sh|src/main.rs|src/workspace_gc.rs) ;;
              *) echo "unexpected changed path: $path" >&2; false ;;
            esac
          done <<< "$changed"
          for required in README.md scripts/install-systemd.sh scripts/start.sh src/main.rs; do
            grep -Fxq "$required" <<< "$changed"
          done

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Diff check
        run: git diff --check

      - name: Commit validated product-only diff
        run: |
          rm tools/apply_stale_workspace_gc.py .github/workflows/apply-stale-workspace-gc.yml
          git fetch origin main
          final_changed="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' README.md scripts/install-systemd.sh scripts/start.sh src/main.rs src/workspace_gc.rs | sort)"
          test "$final_changed" = "$expected"
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add -A
          git commit -m "feat(runtime): garbage-collect verified stale workspaces"
          git push origin HEAD:feat/stale-workspace-gc
