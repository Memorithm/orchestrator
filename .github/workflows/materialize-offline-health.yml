name: materialize offline health command

on:
  push:
    branches: [research/offline-health]
    paths:
      - tools/apply-offline-health.py
      - .github/workflows/materialize-offline-health.yml

permissions:
  contents: write

concurrency:
  group: orchestrator-offline-health-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply offline health CLI
        run: python3 tools/apply-offline-health.py

      - name: Remove one-shot materializer
        run: |
          rm tools/apply-offline-health.py
          rm .github/workflows/materialize-offline-health.yml

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format integrated sources
        run: cargo fmt --all

      - name: Validate runtime shell
        run: |
          bash -n scripts/start.sh
          bash -n scripts/opencode
          bash -n scripts/opencode-env
          bash -n scripts/cargo
          bash -n scripts/git
          bash -n scripts/gh
          bash -n scripts/agent-git
          bash -n scripts/agent-gh
          bash -n scripts/selftest-runtime.sh
          bash -n scripts/selftest-opencode-watchdog.sh
          bash -n scripts/render-systemd-unit.sh
          bash -n scripts/install-systemd.sh
          bash scripts/selftest-runtime.sh
          bash scripts/selftest-opencode-watchdog.sh

      - name: Verify systemd sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/orchestrator-data"
          touch "$RUNNER_TEMP/orchestrator.env"
          bash scripts/render-systemd-unit.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/orchestrator-data" \
            "$RUNNER_TEMP/orchestrator.env" \
            > "$RUNNER_TEMP/memorithm-orchestrator.service"
          systemd-analyze verify "$RUNNER_TEMP/memorithm-orchestrator.service"

      - name: Validate offline health runtime
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Exercise offline health command
        run: |
          tmp="$(mktemp -d)"
          ORCHESTRATOR_DATA_ROOT="$tmp" cargo run --quiet -- health
          ORCHESTRATOR_DATA_ROOT="$tmp" cargo run --quiet -- status
          rm -rf "$tmp"

      - name: Enforce materialized scope
        run: |
          changed="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$changed"
          for expected in \
            src/main.rs \
            src/health.rs \
            tools/apply-offline-health.py \
            .github/workflows/materialize-offline-health.yml
          do
            printf '%s\n' "$changed" | grep -Fxq "$expected"
          done
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/main\.rs|src/health\.rs|tools/apply-offline-health\.py|\.github/workflows/materialize-offline-health\.yml)$' || true)"
          test -z "$unexpected"

      - name: Commit materialized health command
        run: |
          git config user.name 'Memorithm Orchestrator Integration'
          git config user.email 'orchestrator@localhost'
          git add -A
          git commit -m 'feat(health): inspect persistent runtime state offline'
          git push origin HEAD:research/offline-health
