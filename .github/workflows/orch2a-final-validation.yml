name: Temporary ORCH2a final validation

on:
  push:
    branches:
      - feat/orch2a-validation-plan-isolated

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation sandbox dependency
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Generate corrected ORCH2a source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/orch2a-patch.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          old = '''def replace_once(data, old, new, label):\n    count = data.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one match, found {count}')\n    return data.replace(old, new, 1)\n'''
          new = '''def replace_once(data, old, new, label):\n    count = data.count(old)\n    if label == 'issue validation call' and count == 2:\n        return data.replace(old, new, 1)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one match, found {count}')\n    return data.replace(old, new, 1)\n'''
          script = script.replace(old, new, 1)
          exec(compile(script, 'orch2a-transform.py', 'exec'))

          p = Path('src/main.rs')
          data = p.read_text()
          data = data.replace(
              'merge_policy::AutoMergeScope::LifecycleOnly',
              'merge_policy::AutoMergeScope::OrchestratorValidated',
              1,
          )
          data = data.replace(
              'resource_policy: resource::ResourcePolicy::default(),',
              '''resource_policy: resource::ResourcePolicy {\n                min_available_memory_mb: 0,\n                min_free_disk_mb: 0,\n                max_load_per_cpu: 0.0,\n            },''',
              1,
          )

          signature = '''fn persist_validation_step_evidence(\n    config: &RunConfig,\n    item: &WorkItem,\n    snapshot: &policy::PolicySnapshot,\n    plan: &policy::PortableValidationPlan,\n    step: &policy::PortableValidationStep,\n    worktree_head: &str,\n    started_at: u64,\n    finished_at: u64,\n    exit_code: Option<i32>,\n    timed_out: bool,\n) -> Result<PathBuf, String> {\n'''
          replacement = '''struct ValidationStepResult<'a> {\n    worktree_head: &'a str,\n    started_at: u64,\n    finished_at: u64,\n    exit_code: Option<i32>,\n    timed_out: bool,\n}\n\nfn persist_validation_step_evidence(\n    config: &RunConfig,\n    item: &WorkItem,\n    snapshot: &policy::PolicySnapshot,\n    plan: &policy::PortableValidationPlan,\n    step: &policy::PortableValidationStep,\n    result: &ValidationStepResult<'_>,\n) -> Result<PathBuf, String> {\n    let ValidationStepResult {\n        worktree_head,\n        started_at,\n        finished_at,\n        exit_code,\n        timed_out,\n    } = result;\n'''
          if data.count(signature) != 1:
              raise SystemExit(f'persist signature count={data.count(signature)}')
          data = data.replace(signature, replacement, 1)

          runtime_call = '''        worktree_head,\n        started_at,\n        finished_at,\n        status.code(),\n        timed_out,\n    )?;'''
          runtime_replacement = '''        &ValidationStepResult {\n            worktree_head,\n            started_at,\n            finished_at,\n            exit_code: status.code(),\n            timed_out,\n        },\n    )?;'''
          if data.count(runtime_call) != 1:
              raise SystemExit(f'runtime result call count={data.count(runtime_call)}')
          data = data.replace(runtime_call, runtime_replacement, 1)

          test_call = '''            "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",\n            100,\n            101,\n            Some(0),\n            false,\n        )'''
          test_replacement = '''            &ValidationStepResult {\n                worktree_head: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",\n                started_at: 100,\n                finished_at: 101,\n                exit_code: Some(0),\n                timed_out: false,\n            },\n        )'''
          if data.count(test_call) != 2:
              raise SystemExit(f'test result call count={data.count(test_call)}')
          data = data.replace(test_call, test_replacement)
          p.write_text(data)
          PY
      - name: Validate exact corrected source
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit validated source only
        shell: bash
        run: |
          git config user.name 'ZEKRITI Tarek'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add src/main.rs src/policy.rs
          git diff --cached --check
          git commit -m 'feat(validation): execute portable repository plans'
          git push origin HEAD:feat/orch2a-validation-plan-isolated
