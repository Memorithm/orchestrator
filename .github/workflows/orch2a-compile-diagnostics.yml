name: Temporary ORCH2a compiler diagnostics

on:
  push:
    branches:
      - feat/orch2a-validation-plan-staging

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation sandbox dependency
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Generate source and capture command diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/orch2a-patch.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          old = '''def replace_once(data, old, new, label):\n    count = data.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one match, found {count}')\n    return data.replace(old, new, 1)\n'''
          new = '''def replace_once(data, old, new, label):\n    count = data.count(old)\n    if label == 'issue validation call' and count == 2:\n        return data.replace(old, new, 1)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one match, found {count}')\n    return data.replace(old, new, 1)\n'''
          script = script.replace(old, new, 1)
          exec(compile(script, 'orch2a-transform.py', 'exec'))
          PY
          set +e
          : > orch2a-compiler-diagnostics.txt
          cargo fmt --all >> orch2a-compiler-diagnostics.txt 2>&1
          echo "FMT=$?" >> orch2a-compiler-diagnostics.txt
          cargo fmt --all -- --check >> orch2a-compiler-diagnostics.txt 2>&1
          echo "FMT_CHECK=$?" >> orch2a-compiler-diagnostics.txt
          cargo check --workspace >> orch2a-compiler-diagnostics.txt 2>&1
          echo "CHECK=$?" >> orch2a-compiler-diagnostics.txt
          cargo test --workspace >> orch2a-compiler-diagnostics.txt 2>&1
          echo "TEST=$?" >> orch2a-compiler-diagnostics.txt
          cargo clippy --workspace --all-targets -- -D warnings >> orch2a-compiler-diagnostics.txt 2>&1
          echo "CLIPPY=$?" >> orch2a-compiler-diagnostics.txt
          set -e
          git restore src/main.rs src/policy.rs
      - name: Commit diagnostic only
        run: |
          git config user.name 'ZEKRITI Tarek'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add orch2a-compiler-diagnostics.txt
          git commit -m 'chore: record ORCH2a compiler diagnostics'
          git push origin HEAD:feat/orch2a-validation-plan-staging
